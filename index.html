<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверочная работа</title>
<style>
  @font-face {
    font-family: 'ANVYL';
    src: url('file:///C:/Users/Nutzer/Desktop/Расписание SHARH/КНИГИ И презентации 3 КЛАСС/окружающий мир/ANVYL.ttf') format('truetype'),
         url('ANVYL.ttf') format('truetype');
    font-display: swap;
  }

  :root{
    --rust:#8B5FBF;
    --violet:#7B68C8;
    --gold:#EFB85A;
    --blue:#7BA8D9;
    --deep:#3B3050;
    --soft:#7A7090;
    --line:#D6D0E8;
    --ok:#4E8A3C;
    --bad:#B74237;
    --cream:#F8F6FF;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    color:var(--deep);
    background:linear-gradient(180deg,
      #E8EEFB 0%,
      #D4DCF0 22%,
      #C5CFEC 45%,
      #D8E4EE 65%,
      #E8F0E4 82%,
      #F4F0E0 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    overflow-x:hidden;
    position:relative;
  }

  /* ============== КОСМОС: звёзды ============== */
  .stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .stars::before,
  .stars::after{
    content:'';
    position:absolute;
    inset:-10%;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 12%, rgba(255,255,255,.95), transparent 60%),
      radial-gradient(1px 1px at 28% 22%, rgba(255,255,255,.85), transparent 60%),
      radial-gradient(2px 2px at 45% 8%, rgba(255,255,255,.9), transparent 60%),
      radial-gradient(1px 1px at 62% 18%, rgba(255,255,255,.8), transparent 60%),
      radial-gradient(1.5px 1.5px at 78% 14%, rgba(255,255,255,.9), transparent 60%),
      radial-gradient(1px 1px at 88% 28%, rgba(255,255,255,.85), transparent 60%),
      radial-gradient(1.5px 1.5px at 8% 32%, rgba(255,255,255,.85), transparent 60%),
      radial-gradient(1px 1px at 22% 8%, rgba(255,255,255,.8), transparent 60%),
      radial-gradient(2px 2px at 52% 26%, rgba(255,255,255,.9), transparent 60%),
      radial-gradient(1px 1px at 72% 6%, rgba(255,255,255,.85), transparent 60%),
      radial-gradient(1.5px 1.5px at 92% 8%, rgba(255,255,255,.9), transparent 60%),
      radial-gradient(1px 1px at 35% 32%, rgba(255,255,255,.75), transparent 60%),
      radial-gradient(1.5px 1.5px at 68% 32%, rgba(255,255,255,.85), transparent 60%),
      radial-gradient(1px 1px at 16% 18%, rgba(255,255,255,.8), transparent 60%);
    animation:starsTwinkle 6s ease-in-out infinite alternate;
  }
  .stars::after{
    background-size: 340px 340px;
    animation-delay: -3s;
    opacity:.7;
  }
  @keyframes starsTwinkle{
    0%{opacity:.75;}
    100%{opacity:1;}
  }

  /* ============== ПРИРОДА: солнце, облака, деревья, трава ============== */
  .sun{
    position:fixed;
    top:30px;
    left:40px;
    width:90px;
    height:90px;
    border-radius:50%;
    background:radial-gradient(circle at 38% 32%, #FFE9B0 0%, #FBC96E 55%, #F0A94A 100%);
    box-shadow:
      0 0 40px rgba(251,201,110,.55),
      0 0 80px rgba(251,201,110,.3);
    z-index:0;
    pointer-events:none;
    animation:sunPulse 7s ease-in-out infinite;
  }
  .sun::before{
    content:'';
    position:absolute;
    inset:-22px;
    border-radius:50%;
    background:conic-gradient(from 0deg,
      rgba(251,201,110,.35) 0 6deg, transparent 6deg 30deg,
      rgba(251,201,110,.35) 30deg 36deg, transparent 36deg 60deg,
      rgba(251,201,110,.35) 60deg 66deg, transparent 66deg 90deg,
      rgba(251,201,110,.35) 90deg 96deg, transparent 96deg 120deg,
      rgba(251,201,110,.35) 120deg 126deg, transparent 126deg 150deg,
      rgba(251,201,110,.35) 150deg 156deg, transparent 156deg 180deg,
      rgba(251,201,110,.35) 180deg 186deg, transparent 186deg 210deg,
      rgba(251,201,110,.35) 210deg 216deg, transparent 216deg 240deg,
      rgba(251,201,110,.35) 240deg 246deg, transparent 246deg 270deg,
      rgba(251,201,110,.35) 270deg 276deg, transparent 276deg 300deg,
      rgba(251,201,110,.35) 300deg 306deg, transparent 306deg 330deg,
      rgba(251,201,110,.35) 330deg 336deg, transparent 336deg 360deg);
    animation:sunRotate 40s linear infinite;
  }
  @keyframes sunPulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.05);}
  }
  @keyframes sunRotate{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }

  .cloud{
    position:fixed;
    z-index:0;
    pointer-events:none;
    opacity:.75;
    animation:cloudFloat 30s ease-in-out infinite;
  }
  .cloud.c1{ width:130px; top:70px; right:180px; animation-duration:32s; }
  .cloud.c2{ width:100px; top:170px; right:60px; animation-duration:26s; animation-delay:-8s; opacity:.6; }
  .cloud.c3{ width:150px; top:130px; left:35%; animation-duration:38s; animation-delay:-18s; opacity:.55; }
  @keyframes cloudFloat{
    0%,100%{transform:translateX(0);}
    50%{transform:translateX(28px);}
  }

  /* Горы / лес — силуэты внизу */
  .hills{
    position:fixed;
    left:0;right:0;bottom:0;
    height:220px;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .hills svg{
    position:absolute;
    bottom:0;
    width:100%;
    height:100%;
  }

  /* Трава внизу */
  .grass{
    position:fixed;
    left:0;right:0;bottom:0;
    height:60px;
    z-index:0;
    pointer-events:none;
    background:linear-gradient(180deg, transparent 0%, rgba(160,200,140,.15) 40%, rgba(140,190,120,.28) 100%);
  }

  /* ============== ФЛАГ РОССИИ (мягкий, слева вертикально) ============== */
  .flag-corner{
    position:fixed;
    top:50%;
    left:-60px;
    transform:translateY(-50%);
    width:120px;
    height:180px;
    border-radius:0 16px 16px 0;
    overflow:hidden;
    opacity:.35;
    box-shadow:8px 8px 30px rgba(60,90,160,.2);
    z-index:0;
    pointer-events:none;
    filter:blur(.3px);
  }
  .flag-corner .stripe{
    position:absolute;
    left:0;
    width:100%;
    height:33.34%;
  }
  .flag-corner .stripe.white{ top:0; background:#FFFFFF; }
  .flag-corner .stripe.blue{ top:33.33%; background:#4E7BC8; }
  .flag-corner .stripe.red{ top:66.66%; background:#C8554E; }

  /* Шеврон-флаг сверху справа */
  .flag-top-right{
    position:fixed;
    top:30px;
    right:30px;
    width:90px;
    height:60px;
    border-radius:10px;
    overflow:hidden;
    z-index:0;
    pointer-events:none;
    box-shadow:0 10px 26px rgba(60,90,160,.22);
    opacity:.65;
  }
  .flag-top-right .stripe{
    position:absolute;
    left:0;
    width:100%;
    height:33.34%;
  }
  .flag-top-right .stripe.white{ top:0; background:#FFFFFF; }
  .flag-top-right .stripe.blue{ top:33.33%; background:#4E7BC8; }
  .flag-top-right .stripe.red{ top:66.66%; background:#C8554E; }

  /* ============== APP ============== */
  .app{
    width:100%;
    max-width:920px;
    min-height:min(660px, calc(100vh - 32px));
    max-height:calc(100vh - 32px);
    background:rgba(255,253,250,.94);
    border:1.5px solid var(--line);
    border-radius:28px;
    padding:30px 40px 36px;
    box-shadow:
      0 20px 55px rgba(120,100,190,.22),
      inset 0 1px 0 rgba(255,255,255,.9);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    position:relative;
    z-index:2;
    overflow-y:auto;
    overscroll-behavior:contain;
    scroll-behavior:smooth;
  }
  .app::-webkit-scrollbar{width:8px;}
  .app::-webkit-scrollbar-thumb{background:rgba(140,120,200,.3);border-radius:99px;}
  .app::before{
    content:'';
    position:absolute;
    inset:8px;
    border-radius:22px;
    border:1px dashed rgba(140,120,200,.16);
    pointer-events:none;
    z-index:0;
  }

  .screen{
    display:none;
    flex-direction:column;
    animation:screenIn .55s cubic-bezier(.28,.84,.42,1);
    position:relative;
    z-index:1;
    min-height:100%;
  }
  .screen.active{display:flex;}
  @keyframes screenIn{
    from{opacity:0;transform:translateY(18px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* ============ START ============ */
  .start-hero{
    text-align:center;
    padding:30px 10px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    flex:1;
  }
  .start-title{
    font-family:'ANVYL','Segoe UI',sans-serif;
    font-size:clamp(2.2rem,5.5vw,3.6rem);
    color:var(--violet);
    line-height:1.1;
    margin-bottom:18px;
    letter-spacing:1px;
    animation:heroPop .9s cubic-bezier(.28,.84,.42,1);
  }
  @keyframes heroPop{
    0%{opacity:0;transform:scale(.7) rotate(-4deg);}
    60%{opacity:1;transform:scale(1.05) rotate(1.5deg);}
    100%{transform:scale(1) rotate(0);}
  }
  .start-line{
    width:150px;height:4px;
    background:linear-gradient(90deg,transparent,var(--violet),var(--gold),transparent);
    margin:0 auto 22px;border-radius:2px;
  }
  .start-text{
    font-size:clamp(1.05rem,2vw,1.25rem);
    color:var(--soft);
    max-width:620px;
    margin:0 auto 30px;
    line-height:1.55;
  }
  .start-info{
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
    margin-bottom:32px;
  }
  .start-info-item{
    background:rgba(255,255,255,.85);
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:16px 22px;
    min-width:140px;
    text-align:center;
    box-shadow:0 8px 20px rgba(140,120,200,.1);
  }
  .start-info-item .num{
    font-family:'ANVYL','Segoe UI',sans-serif;
    font-size:1.8rem;
    color:var(--rust);
    display:block;
    line-height:1;
    margin-bottom:6px;
  }
  .start-info-item .lbl{
    font-size:.9rem;
    color:var(--soft);
    letter-spacing:.5px;
    text-transform:uppercase;
    font-weight:600;
  }

  /* ============ BUTTONS ============ */
  .btn{
    font-family:inherit;
    font-size:1.1rem;
    font-weight:700;
    padding:14px 42px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    letter-spacing:.6px;
    background:linear-gradient(135deg,var(--violet),var(--rust));
    color:#fff;
    box-shadow:0 10px 26px rgba(140,120,200,.42);
    transition:transform .2s, box-shadow .2s;
    display:inline-block;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(140,120,200,.55);}
  .btn:active{transform:translateY(0) scale(.97);}
  .btn.secondary{
    background:linear-gradient(135deg,var(--gold),#E89B3D);
    box-shadow:0 10px 26px rgba(232,155,61,.35);
  }
  .btn.secondary:hover{box-shadow:0 14px 30px rgba(232,155,61,.5);}

  /* ============ TEST HEADER ============ */
  .test-header{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:22px;
    padding-bottom:16px;
    border-bottom:1.5px solid var(--line);
  }
  .timer-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:linear-gradient(135deg, rgba(255,240,215,.9), rgba(255,225,180,.55));
    border:1.5px solid rgba(232,155,61,.4);
    border-radius:14px;
    padding:8px 18px;
    font-weight:700;
    color:var(--rust);
    font-size:1.1rem;
    font-variant-numeric:tabular-nums;
    flex:none;
  }
  .timer-box .icon{
    font-size:1.1rem;
    color:var(--violet);
  }
  .progress-info{
    flex:1;
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
  }
  .progress-bar{
    flex:1;
    height:8px;
    background:rgba(140,120,200,.14);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--blue),var(--violet),var(--rust));
    border-radius:999px;
    transition:width .4s ease;
  }
  .progress-count{
    font-size:1rem;
    font-weight:700;
    color:var(--violet);
    letter-spacing:.5px;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    flex:none;
  }

  /* ============ QUESTION ============ */
  .q-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:6px 0;
  }
  .q-label{
    display:inline-block;
    align-self:center;
    font-size:.8rem;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--violet);
    background:rgba(140,120,200,.13);
    border:1.5px solid rgba(140,120,200,.35);
    padding:5px 16px;
    border-radius:999px;
    margin-bottom:18px;
  }
  .q-text{
    font-size:clamp(1.15rem,2.4vw,1.5rem);
    font-weight:700;
    color:var(--deep);
    text-align:center;
    line-height:1.45;
    margin-bottom:28px;
    min-height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 10px;
  }
  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    max-width:720px;
    margin:0 auto;
    width:100%;
  }
  .options.three{grid-template-columns:1fr 1fr 1fr;}
  .opt{
    font-family:inherit;
    font-size:1.1rem;
    font-weight:600;
    padding:18px 20px;
    border-radius:16px;
    border:2px solid var(--line);
    background:#FFFDFA;
    color:var(--deep);
    cursor:pointer;
    text-align:center;
    transition:all .22s ease;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:78px;
    line-height:1.35;
    animation:optIn .45s cubic-bezier(.28,.84,.42,1) both;
    letter-spacing:.2px;
  }
  .opt:nth-child(1){animation-delay:.05s;}
  .opt:nth-child(2){animation-delay:.10s;}
  .opt:nth-child(3){animation-delay:.15s;}
  .opt:nth-child(4){animation-delay:.20s;}
  @keyframes optIn{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  .opt:hover:not(.disabled){
    border-color:var(--violet);
    background:#F5F1FF;
    transform:translateY(-3px);
    box-shadow:0 12px 26px rgba(140,120,200,.22);
  }
  .opt.disabled{cursor:default;}
  .opt.good{
    border-color:var(--ok);
    background:linear-gradient(135deg,#EAF6DE,#C8E6C0);
    color:#2E5A1E;
    font-weight:700;
    animation:optGood .7s cubic-bezier(.28,.84,.42,1);
  }
  .opt.bad{
    border-color:var(--bad);
    background:#FFEBEE;
    color:#7F1D1D;
    animation:optBad .5s ease;
  }
  @keyframes optGood{
    0%{transform:scale(1);}
    35%{transform:scale(1.08);box-shadow:0 14px 40px rgba(78,138,60,.4);}
    100%{transform:scale(1);box-shadow:0 6px 20px rgba(78,138,60,.2);}
  }
  @keyframes optBad{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-9px);}
    75%{transform:translateX(9px);}
  }
  .opt-num{
    position:absolute;
    top:8px;
    left:12px;
    width:26px;
    height:26px;
    border-radius:8px;
    background:rgba(140,120,200,.14);
    color:var(--violet);
    font-weight:700;
    font-size:.9rem;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
  }
  .opt:hover:not(.disabled) .opt-num{background:var(--violet);color:#fff;}
  .opt.good .opt-num{background:var(--ok);color:#fff;}
  .opt.bad .opt-num{background:var(--bad);color:#fff;}

  /* ============ RESULT ============ */
  .result-box{
    text-align:center;
    padding:14px 6px;
    display:flex;
    flex-direction:column;
    flex:1;
    justify-content:center;
  }
  .result-medal{
    width:96px;height:96px;
    border-radius:50%;
    margin:0 auto 16px;
    background:linear-gradient(135deg,var(--gold),var(--violet));
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'ANVYL','Segoe UI',sans-serif;
    font-size:2.4rem;
    color:#fff;
    box-shadow:0 14px 36px rgba(140,120,200,.4);
    animation:medalPop 1s cubic-bezier(.28,.84,.42,1);
  }
  @keyframes medalPop{
    0%{opacity:0;transform:scale(.3) rotate(-25deg);}
    60%{opacity:1;transform:scale(1.15) rotate(6deg);}
    100%{transform:scale(1) rotate(0);}
  }
  .result-title{
    font-family:'ANVYL','Segoe UI',sans-serif;
    font-size:clamp(1.7rem,3.6vw,2.4rem);
    color:var(--violet);
    margin-bottom:8px;
    letter-spacing:.5px;
  }
  .result-msg{
    font-size:clamp(1.05rem,2vw,1.2rem);
    color:var(--soft);
    margin-bottom:22px;
    line-height:1.5;
  }
  .result-stats{
    display:flex;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:26px;
  }
  .stat-card{
    background:linear-gradient(135deg, rgba(255,240,215,.9), rgba(240,225,255,.55));
    border:1.5px solid rgba(140,120,200,.35);
    border-radius:20px;
    padding:18px 26px;
    min-width:150px;
    text-align:center;
    box-shadow:0 10px 26px rgba(140,120,200,.12);
  }
  .stat-label{
    font-size:.82rem;
    color:var(--violet);
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:8px;
    font-weight:700;
  }
  .stat-value{
    font-family:'ANVYL','Segoe UI',sans-serif;
    font-size:2.2rem;
    color:var(--rust);
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .stat-value small{
    font-size:.5em;
    color:var(--soft);
    font-weight:600;
  }

  /* NAME */
  .name-block{
    margin:16px auto 22px;
    padding:22px 24px;
    background:linear-gradient(135deg, rgba(245,241,255,.9), rgba(255,240,220,.7));
    border:1.5px dashed rgba(140,120,200,.35);
    border-radius:20px;
    max-width:560px;
    width:100%;
    transition:.3s;
  }
  .name-label{
    font-size:1.1rem;
    font-weight:700;
    color:var(--violet);
    margin-bottom:14px;
    letter-spacing:.5px;
  }
  .name-inline{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
  }
  .name-input{
    font-family:inherit;
    font-size:1.15rem;
    font-weight:600;
    padding:12px 20px;
    border:2px solid #E0D8F0;
    border-radius:14px;
    flex:1 1 220px;
    max-width:320px;
    text-align:center;
    outline:none;
    background:#FFFDFA;
    color:var(--deep);
    letter-spacing:.5px;
    transition:.22s;
  }
  .name-input:focus{
    border-color:var(--violet);
    box-shadow:0 0 0 5px rgba(140,120,200,.18);
  }
  .save-btn{
    font-family:inherit;
    font-size:1.05rem;
    font-weight:700;
    padding:12px 26px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    background:linear-gradient(135deg,var(--violet),var(--rust));
    color:#fff;
    letter-spacing:.5px;
    box-shadow:0 8px 20px rgba(140,120,200,.4);
    transition:transform .2s, box-shadow .2s;
  }
  .save-btn:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 12px 26px rgba(140,120,200,.55);
  }
  .save-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
    box-shadow:none;
  }

  .saved-note{
    display:none;
    margin-top:14px;
    font-size:1rem;
    color:var(--ok);
    font-weight:700;
    letter-spacing:.5px;
  }
  .saved-note.show{display:block; animation:fadeInUp .5s ease;}
  @keyframes fadeInUp{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* History */
  .history{
    margin-top:20px;
    max-width:640px;
    margin-left:auto;
    margin-right:auto;
    width:100%;
  }
  .history-title{
    font-size:.9rem;
    font-weight:700;
    color:var(--violet);
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin-bottom:10px;
  }
  .history-list{
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height:180px;
    overflow-y:auto;
    padding-right:6px;
  }
  .history-list::-webkit-scrollbar{width:6px;}
  .history-list::-webkit-scrollbar-thumb{background:rgba(140,120,200,.25);border-radius:99px;}
  .history-row{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:12px;
    padding:9px 14px;
    background:rgba(255,255,255,.85);
    border:1.5px solid var(--line);
    border-radius:12px;
    font-size:.98rem;
    align-items:center;
  }
  .history-row .name{
    font-weight:700;
    color:var(--deep);
    text-align:left;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .history-row .score{
    font-weight:700;
    color:var(--rust);
    font-variant-numeric:tabular-nums;
  }
  .history-row .time{
    color:var(--soft);
    font-size:.9rem;
    font-variant-numeric:tabular-nums;
  }

  /* CONFETTI */
  .confetti{
    position:fixed;
    width:10px;height:13px;border-radius:2px;
    pointer-events:none;z-index:2147483647;
    animation:confettiFall var(--dur) cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes confettiFall{
    0%{transform:translate(-50%,-50%) rotate(0deg) scale(1);opacity:1;}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(.6);opacity:0;}
  }

  @media (max-width:700px){
    .sun{width:64px;height:64px;top:20px;left:22px;}
    .cloud.c1{width:90px;top:60px;right:80px;}
    .cloud.c2{width:70px;top:150px;right:20px;}
    .cloud.c3{display:none;}
    .flag-top-right{width:66px;height:44px;top:20px;right:20px;}
    .flag-corner{display:none;}
  }

  @media (max-width:600px){
    .app{padding:22px 20px 30px;border-radius:22px;}
    .options{grid-template-columns:1fr;gap:10px;}
    .options.three{grid-template-columns:1fr;}
    .opt{min-height:64px;font-size:1.02rem;padding:14px 16px;}
    .test-header{flex-wrap:wrap;gap:10px;}
    .result-stats{gap:10px;}
    .stat-card{padding:14px 18px;min-width:120px;}
    .stat-value{font-size:1.7rem;}
    .hills{height:150px;}
  }
</style>
</head>
<body>

<!-- КОСМОС: звёзды -->
<div class="stars"></div>

<!-- ФЛАГ РОССИИ: угловые элементы -->
<div class="flag-corner" aria-hidden="true">
  <div class="stripe white"></div>
  <div class="stripe blue"></div>
  <div class="stripe red"></div>
</div>
<div class="flag-top-right" aria-hidden="true">
  <div class="stripe white"></div>
  <div class="stripe blue"></div>
  <div class="stripe red"></div>
</div>

<!-- ПРИРОДА: солнце, облака, горы, трава -->
<div class="sun" aria-hidden="true"></div>

<svg class="cloud c1" viewBox="0 0 130 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <path d="M30 48 C10 48, 6 34, 18 30 C18 16, 40 10, 52 18 C60 6, 88 6, 96 20 C116 18, 126 34, 116 48 Z"
        fill="#FFFFFF" stroke="#D8E4F0" stroke-width="1.5"/>
</svg>
<svg class="cloud c2" viewBox="0 0 130 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <path d="M30 48 C10 48, 6 34, 18 30 C18 16, 40 10, 52 18 C60 6, 88 6, 96 20 C116 18, 126 34, 116 48 Z"
        fill="#FFFFFF" stroke="#D8E4F0" stroke-width="1.5"/>
</svg>
<svg class="cloud c3" viewBox="0 0 130 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <path d="M30 48 C10 48, 6 34, 18 30 C18 16, 40 10, 52 18 C60 6, 88 6, 96 20 C116 18, 126 34, 116 48 Z"
        fill="#FFFFFF" stroke="#D8E4F0" stroke-width="1.5"/>
</svg>

<div class="hills" aria-hidden="true">
  <svg viewBox="0 0 1200 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <!-- дальние горы -->
    <path d="M0 220 L0 130 L120 60 L240 130 L360 40 L500 150 L640 70 L780 150 L920 50 L1080 130 L1200 80 L1200 220 Z"
          fill="#B7D4B0" opacity=".5"/>
    <!-- ёлки-силуэты -->
    <path d="M120 220 L120 150 L100 150 L120 100 L100 100 L120 50 L140 100 L120 100 L140 150 L120 150 Z" fill="#7BA468" opacity=".55"/>
    <path d="M240 220 L240 160 L224 160 L240 120 L224 120 L240 80 L256 120 L240 120 L256 160 L240 160 Z" fill="#7BA468" opacity=".5"/>
    <path d="M920 220 L920 150 L900 150 L920 100 L900 100 L920 50 L940 100 L920 100 L940 150 L920 150 Z" fill="#7BA468" opacity=".55"/>
    <path d="M1080 220 L1080 160 L1064 160 L1080 120 L1064 120 L1080 80 L1096 120 L1080 120 L1096 160 L1080 160 Z" fill="#7BA468" opacity=".5"/>
    <!-- ближние холмы -->
    <path d="M0 220 L0 190 Q150 140 320 180 T640 175 T960 180 T1200 170 L1200 220 Z"
          fill="#A8D0A0" opacity=".65"/>
  </svg>
</div>
<div class="grass" aria-hidden="true"></div>

<!-- ============ APP ============ -->
<div class="app" id="app">

  <!-- ===== START ===== -->
  <div class="screen active" id="screenStart">
    <div class="start-hero">
      <div class="start-title">Проверочная работа</div>
      <div class="start-line"></div>
      <div class="start-text">Выполни задания и проверь себя. Читай вопрос внимательно и выбирай один верный ответ.</div>
      <div class="start-info">
        <div class="start-info-item">
          <span class="num">14</span>
          <span class="lbl">Вопросов</span>
        </div>
        <div class="start-info-item">
          <span class="num">A Б В Г</span>
          <span class="lbl">Варианты ответа</span>
        </div>
        <div class="start-info-item">
          <span class="num">⏱</span>
          <span class="lbl">С таймером</span>
        </div>
      </div>
      <div>
        <button class="btn" id="startBtn" type="button">Начать работу</button>
      </div>
    </div>
  </div>

  <!-- ===== TEST ===== -->
  <div class="screen" id="screenTest">
    <div class="test-header">
      <div class="timer-box"><span class="icon">⏱</span><span id="timer">00:00</span></div>
      <div class="progress-info">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-count" id="progressCount">1 / 14</div>
      </div>
    </div>
    <div class="q-wrap">
      <div class="q-label" id="qLabel">Вопрос 1</div>
      <div class="q-text" id="qText"></div>
      <div class="options" id="options"></div>
    </div>
  </div>

  <!-- ===== RESULT ===== -->
  <div class="screen" id="screenResult">
    <div class="result-box">
      <div class="result-medal" id="medal">★</div>
      <div class="result-title">Работа завершена</div>
      <div class="result-msg" id="resultMsg"></div>

      <div class="result-stats">
        <div class="stat-card">
          <div class="stat-label">Результат</div>
          <div class="stat-value" id="resScore">0<small> / 14</small></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Время</div>
          <div class="stat-value" id="resTime">00:00</div>
        </div>
      </div>

      <div class="name-block" id="nameBlock">
        <div class="name-label">Как тебя зовут?</div>
        <div class="name-inline">
          <input type="text" class="name-input" id="nameInput" placeholder="Введи имя" maxlength="24" autocomplete="off">
          <button class="save-btn" id="saveBtn" type="button" disabled>Сохранить</button>
        </div>
        <div class="saved-note" id="savedNote">✓ Результат сохранён</div>
      </div>

      <div class="history" id="historyBox" style="display:none;">
        <div class="history-title">Сохранённые результаты</div>
        <div class="history-list" id="historyList"></div>
      </div>

      <div style="margin-top:22px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <button class="btn secondary" id="restartBtn" type="button">Пройти заново</button>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  /* ================= DATA ================= */
  const QUESTIONS = [
    {
      q: 'Что не относится к неживой природе?',
      options: ['земля', 'дерево', 'Солнце', 'вода'],
      correct: 1
    },
    {
      q: 'В какой строке перечислены только предметы живой природы?',
      options: ['человек, дуб, земля', 'Солнце, вода, облако', 'гриб, медведь, воробей', 'вода, лиса, камень'],
      correct: 2
    },
    {
      q: 'Где у человека «помещается» разум?',
      options: ['в спинном мозге', 'в головном мозге', 'в сердце', 'в лёгких'],
      correct: 1
    },
    {
      q: 'Как называют всех людей Земли?',
      options: ['Народ', 'Общество', 'Граждане', 'Россияне'],
      correct: 1
    },
    {
      q: 'Какого главу государства переизбирают?',
      options: ['султана', 'королеву', 'президента', 'монарха'],
      correct: 2
    },
    {
      q: 'Сколько народов проживает на территории России?',
      options: ['около 100', 'около 160', 'около 190', 'около 200'],
      correct: 2
    },
    {
      q: 'Восстановите цепочку: Ядохимикаты — комары — растения — тараканы — … — кошки.',
      options: ['лягушки', 'ящерицы', 'крысы', 'мыши'],
      correct: 1
    },
    {
      q: 'Какой предмет не относится к живой природе?',
      options: ['Солнце', 'берёза', 'собака'],
      correct: 0
    },
    {
      q: 'Найдите неверное высказывание.',
      options: [
        'Природа даёт человеку продукты питания.',
        'Природа вредит здоровью человека.',
        'Природа даёт человеку сырьё для промышленности.'
      ],
      correct: 1
    },
    {
      q: 'Что отличает человека от других живых существ?',
      options: ['способность общаться', 'умение ходить на двух ногах', 'разум', 'память'],
      correct: 2
    },
    {
      q: 'Что считается маленькой частью общества?',
      options: ['народ', 'семья', 'класс', 'соседи по дому'],
      correct: 1
    },
    {
      q: 'Какой город является столицей России?',
      options: ['Санкт-Петербург', 'Нижний Новгород', 'Москва', 'Рязань'],
      correct: 2
    },
    {
      q: 'Что не является символом государства?',
      options: ['Плакат', 'Флаг', 'Герб', 'Гимн'],
      correct: 0
    },
    {
      q: 'Как называется всё, что окружает живое существо?',
      options: ['окружающая среда', 'окружающий мир', 'окружающая природа'],
      correct: 0
    }
  ];

  const TOTAL = QUESTIONS.length;
  const STORAGE_KEY = 'sharh_test_results_v1';

  /* ================= DOM ================= */
  const screenStart = document.getElementById('screenStart');
  const screenTest = document.getElementById('screenTest');
  const screenResult = document.getElementById('screenResult');
  const startBtn = document.getElementById('startBtn');
  const timerEl = document.getElementById('timer');
  const progressFill = document.getElementById('progressFill');
  const progressCount = document.getElementById('progressCount');
  const qLabel = document.getElementById('qLabel');
  const qText = document.getElementById('qText');
  const optionsEl = document.getElementById('options');
  const medalEl = document.getElementById('medal');
  const resultMsg = document.getElementById('resultMsg');
  const resScore = document.getElementById('resScore');
  const resTime = document.getElementById('resTime');
  const nameBlock = document.getElementById('nameBlock');
  const nameInput = document.getElementById('nameInput');
  const saveBtn = document.getElementById('saveBtn');
  const savedNote = document.getElementById('savedNote');
  const restartBtn = document.getElementById('restartBtn');
  const historyBox = document.getElementById('historyBox');
  const historyList = document.getElementById('historyList');
  const appEl = document.getElementById('app');

  /* ================= STATE ================= */
  let current = 0;
  let score = 0;
  let locked = false;
  let startTime = 0;
  let timerInterval = null;
  let elapsedSec = 0;
  let answers = [];

  /* ================= UTILS ================= */
  function showScreen(id){
    [screenStart, screenTest, screenResult].forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    appEl.scrollTop = 0;
  }

  function fmtTime(sec){
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function tickTimer(){
    elapsedSec = Math.floor((Date.now() - startTime) / 1000);
    timerEl.textContent = fmtTime(elapsedSec);
  }

  /* ================= CONFETTI ================= */
  const COLORS = ['#8B5FBF','#EFB85A','#7BA8D9','#B4A6E0','#F2B05A','#F5D8B0','#7B68C8','#E89B3D','#C08AB2','#A7B8DE'];
  function burstConfetti(x, y, count){
    for(let i = 0; i < count; i++){
      const p = document.createElement('div');
      p.className = 'confetti';
      const angle = Math.random() * Math.PI * 2;
      const dist = 70 + Math.random() * 240;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 130;
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
      p.style.width = (5 + Math.random() * 8) + 'px';
      p.style.height = (8 + Math.random() * 11) + 'px';
      p.style.borderRadius = Math.random() < 0.4 ? '50%' : '2px';
      p.style.boxShadow = '0 0 10px ' + p.style.background;
      p.style.setProperty('--dx', dx + 'px');
      p.style.setProperty('--dy', dy + 'px');
      p.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
      p.style.setProperty('--dur', (0.9 + Math.random() * 1.0) + 's');
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 2400);
    }
  }
  function burstFromEl(el, count){
    if(!el) return;
    const r = el.getBoundingClientRect();
    burstConfetti(r.left + r.width / 2, r.top + r.height / 2, count);
  }

  /* ================= RENDER QUESTION ================= */
  function renderQuestion(){
    locked = false;
    const q = QUESTIONS[current];
    qLabel.textContent = 'Вопрос ' + (current + 1);
    qText.textContent = q.q;
    optionsEl.innerHTML = '';
    optionsEl.className = 'options' + (q.options.length === 3 ? ' three' : '');

    const letters = ['A', 'Б', 'В', 'Г'];
    q.options.forEach((optText, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'opt';
      btn.innerHTML = `<span class="opt-num">${letters[i]}</span><span>${optText}</span>`;
      btn.dataset.index = i;
      btn.addEventListener('click', () => chooseAnswer(i, btn));
      optionsEl.appendChild(btn);
    });

    progressCount.textContent = (current + 1) + ' / ' + TOTAL;
    progressFill.style.width = ((current) / TOTAL * 100) + '%';
  }

  /* ================= CHOOSE ================= */
  function chooseAnswer(idx, btn){
    if(locked) return;
    locked = true;
    const q = QUESTIONS[current];
    const isCorrect = idx === q.correct;
    answers.push({ q: q.q, chosen: q.options[idx], correct: q.options[q.correct], ok: isCorrect });

    const allBtns = optionsEl.querySelectorAll('.opt');
    allBtns.forEach(b => b.classList.add('disabled'));

    allBtns[q.correct].classList.add('good');

    if(isCorrect){
      score++;
      burstFromEl(btn, 40);
      btn.classList.add('good');
      setTimeout(nextQuestion, 1200);
    } else {
      btn.classList.add('bad');
      setTimeout(() => {
        allBtns[q.correct].classList.add('good');
      }, 350);
      setTimeout(nextQuestion, 1700);
    }
  }

  function nextQuestion(){
    current++;
    if(current >= TOTAL){
      finish();
    } else {
      renderQuestion();
    }
  }

  /* ================= START ================= */
  function startTest(){
    current = 0;
    score = 0;
    answers = [];
    elapsedSec = 0;
    locked = false;
    startTime = Date.now();
    timerEl.textContent = '00:00';
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(tickTimer, 250);

    showScreen('screenTest');
    renderQuestion();
  }

  /* ================= FINISH ================= */
  function finish(){
    clearInterval(timerInterval);
    timerInterval = null;
    elapsedSec = Math.floor((Date.now() - startTime) / 1000);

    showScreen('screenResult');

    resScore.innerHTML = score + '<small> / ' + TOTAL + '</small>';
    resTime.textContent = fmtTime(elapsedSec);

    const pct = score / TOTAL;
    let medal = '★';
    let msg = '';
    if(pct === 1){
      medal = '★';
      msg = 'Превосходно! Ты ответил на все вопросы верно.';
    } else if(pct >= 0.8){
      medal = '◆';
      msg = 'Отличный результат! Почти всё правильно.';
    } else if(pct >= 0.6){
      medal = '●';
      msg = 'Хорошо, но некоторые вопросы стоит повторить.';
    } else if(pct >= 0.4){
      medal = '○';
      msg = 'Неплохо, но материал ещё нужно повторить.';
    } else {
      medal = '◇';
      msg = 'Не расстраивайся, попробуй ещё раз — всё получится.';
    }
    medalEl.textContent = medal;
    resultMsg.textContent = msg;

    nameBlock.style.display = 'block';
    nameInput.value = '';
    nameInput.disabled = false;
    saveBtn.disabled = true;
    savedNote.classList.remove('show');

    renderHistory();
    setTimeout(() => burstFromEl(resScore, 80), 250);
  }

  /* ================= RESTART ================= */
  function restart(){
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = null;
    startTest();
  }

  /* ================= SAVE ================= */
  function loadResults(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      const data = JSON.parse(raw);
      return Array.isArray(data) ? data : [];
    } catch(e){ return []; }
  }
  function saveResults(list){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch(e){}
  }

  function renderHistory(){
    const list = loadResults();
    if(list.length === 0){
      historyBox.style.display = 'none';
      return;
    }
    historyBox.style.display = 'block';
    historyList.innerHTML = '';
    list.slice().reverse().forEach(r => {
      const row = document.createElement('div');
      row.className = 'history-row';
      row.innerHTML = `
        <span class="name">${escapeHtml(r.name)}</span>
        <span class="score">${r.score} / ${r.total}</span>
        <span class="time">${fmtTime(r.time)}</span>
      `;
      historyList.appendChild(row);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
  }

  function saveResult(){
    const name = nameInput.value.trim();
    if(name.length < 2) return;
    const list = loadResults();
    list.push({
      name: name,
      score: score,
      total: TOTAL,
      time: elapsedSec,
      date: new Date().toISOString()
    });
    saveResults(list);
    saveBtn.disabled = true;
    nameInput.disabled = true;
    savedNote.classList.add('show');
    burstFromEl(savedNote, 30);
    renderHistory();
  }

  /* ================= EVENTS ================= */
  startBtn.addEventListener('click', startTest);
  restartBtn.addEventListener('click', restart);
  saveBtn.addEventListener('click', saveResult);

  nameInput.addEventListener('input', () => {
    saveBtn.disabled = nameInput.value.trim().length < 2;
  });
  nameInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !saveBtn.disabled){
      e.preventDefault();
      saveResult();
    }
  });

  document.addEventListener('keydown', (e) => {
    if(screenStart.classList.contains('active') && e.key === 'Enter'){
      e.preventDefault();
      startTest();
      return;
    }
    if(!screenTest.classList.contains('active')) return;
    if(e.target.tagName === 'INPUT') return;
    if(locked) return;

    const map = { '1':0, '2':1, '3':2, '4':3,
                  'a':0, 'A':0, 'б':1, 'Б':1, 'b':1, 'B':1,
                  'в':2, 'В':2, 'c':2, 'C':2,
                  'г':3, 'Г':3, 'd':3, 'D':3 };
    const idx = map[e.key];
    if(idx !== undefined){
      const btns = optionsEl.querySelectorAll('.opt');
      if(btns[idx]) {
        e.preventDefault();
        btns[idx].click();
      }
    }
  });

  /* ================= INIT ================= */
  showScreen('screenStart');
  renderHistory();
})();
</script>
</body>
</html>
